name: CI/CD

# Single pipeline: build/test on PRs to master; on push to master, release when
# CFBundleShortVersionString in Info.plist.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and Test
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

  detect-release:
    name: Detect version change
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare Info.plist version
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() {
            python3 -c "import plistlib,sys; print(plistlib.load(sys.stdin.buffer)['CFBundleShortVersionString'])"
          }
          new=$(read_version < Info.plist)
          old=$(git show "$BEFORE:Info.plist" 2>/dev/null | read_version || true)
          echo "old=$old new=$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" != "$old" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, notarize and publish
    needs: [detect-release]
    if: needs.detect-release.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_pw=$(openssl rand -hex 16)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build and sign
        run: make export

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          make notarize NOTARY_AUTH='--apple-id "$$APPLE_ID" --password "$$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$$APPLE_TEAM_ID"'

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"
          make appcast APPCAST_FLAGS="--ed-key-file $RUNNER_TEMP/sparkle.key --download-url-prefix https://github.com/${{ github.repository }}/releases/latest/download/"
          rm -f "$RUNNER_TEMP/sparkle.key"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            export/ProcessMonitor.zip export/appcast.xml \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Update Homebrew cask (in-repo)
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          sha=$(shasum -a 256 export/ProcessMonitor.zip | awk '{print $1}')
          echo "SHA=$sha" >> "$GITHUB_ENV"
          git fetch origin master
          git checkout -B master origin/master
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/devprocessmonitor.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): cask sha256 for v${VERSION}"
          git push origin master

      - name: Update Homebrew tap
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
          TAP_TOKEN: ${{ secrets.TAP_PUSH_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/FagundesCristianoF/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/devprocessmonitor.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "devprocessmonitor ${VERSION}"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }

name: CI

# Single pipeline: tests on PRs and master; releases when a push to master
# changes CFBundleShortVersionString in Info.plist.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          elif [ -d "/Applications/Xcode_15.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app
          elif [ -d "/Applications/Xcode_15.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.2.app
          else
            echo "Falling back to default Xcode"
            sudo xcode-select -s /Applications/Xcode.app || true
          fi
          xcode-select -p

      - name: Print Swift version
        run: swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift', '**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Swift build
        run: swift build

      - name: Swift test
        run: swift test

  detect-release:
    name: Detect version change
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare Info.plist version
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() {
            python3 -c "import plistlib,sys; print(plistlib.load(sys.stdin.buffer)['CFBundleShortVersionString'])"
          }
          new=$(read_version < Info.plist)
          old=$(git show "$BEFORE:Info.plist" 2>/dev/null | read_version || true)
          echo "old=$old new=$new"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ "$new" != "$old" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$new" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, notarize and publish
    needs: [build-and-test, detect-release]
    if: needs.detect-release.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_pw=$(openssl rand -hex 16)
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_pw" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Build and sign
        run: make export

      - name: Notarize
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: |
          echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          make notarize NOTARY_AUTH="--key $RUNNER_TEMP/notary.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_ED_KEY" > "$RUNNER_TEMP/sparkle.key"
          make appcast APPCAST_FLAGS="--ed-key-file $RUNNER_TEMP/sparkle.key --download-url-prefix https://github.com/${{ github.repository }}/releases/latest/download/"
          rm -f "$RUNNER_TEMP/sparkle.key"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            export/ProcessMonitor.zip export/appcast.xml \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes

      - name: Update Homebrew cask
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          sha=$(shasum -a 256 export/ProcessMonitor.zip | awk '{print $1}')
          git fetch origin master
          git checkout -B master origin/master
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/devprocessmonitor.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): cask sha256 for v${VERSION}"
          git push origin master
